<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Discover thousands of movies and TV shows on Parallax TV, a free streaming platform designed for simple browsing, minimal ads, and a smooth, enjoyable viewing experience.">
<meta name="robots" content="index, follow">
<title>Parallax TV</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<link rel="icon" href="favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://cinesrc.st">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button class="brand" id="brand" type="button" aria-label="Parallax TV, refresh content">
  <img class="brand__icon" src="icon.svg" alt="" width="36" height="36" draggable="false">
</button>

<main id="content" class="content">
  <form class="search" id="search" role="search" autocomplete="off">
    <div class="search__field">
      <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input class="search__input" id="search-input" type="search" name="q" placeholder=" " spellcheck="false" enterkeyhint="search">
      <label class="search__placeholder" for="search-input">TMDB ID or Movie Name</label>
      <span class="search__sheen" aria-hidden="true"></span>
    </div>
    <button class="search__play" type="submit" aria-label="Play">
      <svg class="search__play-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 5.27368C5 3.56682 6.82609 2.48151 8.32538 3.2973L20.687 10.0235C22.2531 10.8756 22.2531 13.124 20.687 13.9762L8.32538 20.7024C6.82609 21.5181 5 20.4328 5 18.726V5.27368Z"></path></svg>
    </button>
    <p class="search__hint" id="search-hint" aria-live="polite"></p>
  </form>
</main>

<section class="player" id="player" aria-label="Player" hidden>
  <div class="player__backdrop" id="player-backdrop" aria-hidden="true"></div>
  <div class="player__stage">
    <span class="player__loader" aria-hidden="true">
      <img class="player__logo" src="icon.svg" alt="" width="104" height="104" draggable="false">
      <span class="player__glint"></span>
    </span>
    <p class="player__caption" id="player-caption" aria-live="polite"></p>
    <div class="picker" id="picker" hidden></div>
  </div>
  <div class="player__frame" id="player-frame"></div>
  <button class="player__back" id="player-back" type="button" aria-label="Back to home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
  </button>
</section>

<p class="sr-only" id="refresh-status" aria-live="polite"></p>
<script src="script.js" defer></script>
</body>
</html>
